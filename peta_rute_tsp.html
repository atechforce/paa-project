    <style>
        @keyframes pulse-ring {
            0%   { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        .animasi-marker {
            width: 18px;
            height: 18px;
            background: #ef4444;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 0 12px 4px rgba(239,68,68,0.5);
            position: relative;
        }

        .animasi-marker::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(239,68,68,0.4);
            animation: pulse-ring 1.2s ease-out infinite;
        }

        .animasi-trail {
            width: 8px;
            height: 8px;
            background: rgba(239,68,68,0.5);
            border-radius: 50%;
            pointer-events: none;
        }

        #algo-dropdown-container {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 9999;
            background: white;
            padding: 14px 18px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            font-family: Arial, sans-serif;
            font-size: 13px;
            min-width: 240px;
        }

        #algo-dropdown-container select {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            background: white;
            transition: border-color 0.2s;
        }

        #algo-dropdown-container select:focus {
            outline: none;
            border-color: #2563eb;
        }

        #algo-info {
            margin-top: 8px;
            font-size: 12px;
            color: #6b7280;
            line-height: 1.5;
        }

        #animasi-kontrol {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 9999;
            background: white;
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            font-family: Arial, sans-serif;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 200px;
        }

        #animasi-kontrol button {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        #btn-play {
            background: #2563eb;
            color: white;
        }
        #btn-play:hover {
            background: #1d4ed8;
        }

        #btn-restart {
            background: #f3f4f6;
            color: #374151;
        }
        #btn-restart:hover {
            background: #e5e7eb;
        }

        #animasi-info {
            font-size: 12px;
            color: #6b7280;
            text-align: center;
            min-height: 18px;
        }

        #animasi-progress-bar {
            width: 100%;
            height: 6px;
            background: #e5e7eb;
            border-radius: 3px;
            overflow: hidden;
        }

        #animasi-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #ef4444);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }

        #speed-kontrol {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #6b7280;
        }

        #speed-kontrol input {
            flex: 1;
        }

        .marker-dp div {
            background-color: #2563eb !important;
        }

        .marker-bf div {
            background-color: #10b981 !important;
